<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>说给所有人听的中国美术史｜课程入口</title>
  <link rel="stylesheet" href="../../assets/components/section-heading.css">
  <style>
    :root {
      --paper: #f1ebdf;
      --ink: #304e46;
      --question-ink: #29483f;
      --body-ink: #46534d;
      --muted: #756f66;
      --line: #b6b9a9;
      --serif: "Source Han Serif CN", "Noto Serif CJK SC", serif;
      --sans: "Source Han Sans CN", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: #dedfda; }
    body { margin: 0; }
    .page {
      width: 1080px;
      min-height: 3900px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }
    .opening {
      height: 820px;
      position: relative;
      isolation: isolate;
    }
    .landscape {
      position: absolute;
      inset: -110px auto auto 0;
      width: 1080px;
      height: 1000px;
      object-fit: cover;
      z-index: -2;
      mix-blend-mode: multiply;
      opacity: .86;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 67%, transparent 91%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 67%, transparent 91%);
    }
    .course-title {
      position: absolute;
      left: 74px;
      top: 108px;
      margin: 0;
      font: 500 84px/1.3 var(--serif);
      letter-spacing: 0;
    }
    .course-title strong {
      display: block;
      font-size: 164px;
      font-weight: 700;
      line-height: 1.25;
    }
    .quote-band {
      position: absolute;
      left: 77px;
      top: 490px;
      margin: 0;
      padding: 0;
      font: 700 50px/1.6 var(--serif);
      letter-spacing: 0;
      color: var(--ink);
      white-space: nowrap;
    }
    .entry {
      margin: 0 77px;
      padding: 0 0 105px;
      color: var(--body-ink);
    }
    .entry-lead {
      max-width: 920px;
      margin: 0 0 70px;
      font: 400 50px/1.65 var(--sans);
      letter-spacing: 0;
    }
    .questions {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 0 0 100px;
      padding: 0 0 0 40px;
      border-left: 3px solid var(--line);
      font: 700 64px/1.48 var(--serif);
      color: var(--question-ink);
      font-weight: 700;
    }
    .questions p { margin: 0; }
    .entry-copy {
      max-width: 923px;
      font: 400 50px/1.65 var(--sans);
      letter-spacing: 0;
      line-break: strict;
    }
      .entry-copy p { margin: 0 0 56px; }
      .entry-copy .keep-phrase { white-space: nowrap; }
      .entry-copy .intro-opening { letter-spacing: -1.5px; }
    .entry-copy .closing {
      margin-top: 65px;
      margin-bottom: 0;
      font-weight: 500;
      color: var(--ink);
    }
    .teacher-generated {
      margin: 0 auto;
      width: 900px;
    }
    .teacher-generated img {
      display: block;
      width: 100%;
      height: auto;
    }
    .teacher-bio {
      width: 900px;
      margin: 36px auto 0;
      color: var(--body-ink);
      font: 400 36px/1.75 var(--sans);
      line-break: strict;
      text-align: justify;
      text-align-last: left;
      text-justify: inter-ideograph;
    }
    .teacher-card {
      display: flex;
      align-items: center;
      min-height: 560px;
      margin: 0 0 100px;
      padding: 34px 42px;
      border-radius: 24px;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
    }
    .teacher-card img {
      width: 448px;
      height: 448px;
      object-fit: contain;
      flex: 0 0 auto;
      align-self: flex-end;
      margin-right: 34px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.12));
    }
    .teacher-card h3 {
      margin: 0 0 18px;
      font: 700 60px/1.2 var(--serif);
      color: var(--paper);
    }
    .teacher-card p {
      margin: 0 0 14px;
      font: 400 34px/1.55 var(--sans);
      color: rgba(241,235,223,.92);
    }
    @media screen and (max-width: 1080px) {
      body { width: 1080px; }
    }
  </style>
</head>
<body>
  <main class="page" id="course-detail">
    <section class="opening" aria-label="课程入口">
      <img class="landscape" src="assets/ni-zan-entry-visual.png" alt="倪瓒山水画局部的淡墨背景">
      <h1 class="course-title">说给所有人听的<strong>中国美术史</strong></h1>
    </section>
    <div class="quote-band">“了解艺术史，就是了解<br>人类意趣变化的历史。”</div>
    <section class="entry" aria-label="课程简介">
      <p class="entry-lead">面对中国美术史上的经典，<br>我们常常会有这样的疑问：</p>
      <div class="questions">
        <p>色彩不丰富？</p>
        <p>画得也不“像”？</p>
        <p>到底好在哪？</p>
      </div>
      <div class="entry-copy">
        <p class="intro-opening">一件作品的技法与形式，往往都是创作者观念与思考的呈现。它们背后，也承载着中国人千年来对生活、自然与世界的<span class="keep-phrase">理解。</span></p>
        <p>陈衔老师将带领大家从观念的演变出发，理解不同时代、不同题材的作品，如何呈现中国人的生活理想。</p>
        <p class="closing">由此，我们才能真正看见<br>中国美术史的精彩所在。</p>
      </div>
      <div class="section-heading"><h2>老师介绍</h2></div>
      <figure class="teacher-generated" aria-label="陈衔老师介绍">
        <img src="../teacher-intro-image2-v2/老师介绍_卡片_v2.png" width="1080" height="648" alt="陈衔，广州美术学院副教授，广美最受欢迎老师，从事理论教学40余年。">
      </figure>
      <p class="teacher-bio">长期从事中西方美术史教学，开设《道家与中国古代绘画》《哲学入门》等课程，擅长从观念演变的角度讲解艺术史，深入浅出、生动活泼。</p>
    </section>
  </main>
</body>
</html>
