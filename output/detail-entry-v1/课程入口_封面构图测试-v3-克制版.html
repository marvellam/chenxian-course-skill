<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国美术史｜克制版构图测试</title>
  <style>
    :root {
      --paper: #f3eee4;
      --ink: #2f5147;
      --soft: #66756d;
      --block: #2f5147;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #dcd4c7; }
    body {
      display: flex;
      justify-content: center;
      padding: 40px;
      font-family: "Source Han Sans CN", "Source Han Sans", sans-serif;
    }
    .cover {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 24px 72px rgba(48, 43, 35, .16);
    }
    .art {
      position: absolute;
      top: 0;
      right: 0;
      width: 470px;
      height: 1110px;
      overflow: hidden;
      background: #ddd8cc;
    }
    .art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 67% 57%;
      filter: saturate(.68) contrast(.96);
    }
    .title {
      position: absolute;
      z-index: 1;
      left: 72px;
      top: 126px;
      width: 720px;
    }
    .eyebrow {
      margin: 0 0 26px;
      font-family: "Source Han Serif CN", "Source Han Serif", serif;
      font-size: 62px;
      line-height: 1;
      letter-spacing: .04em;
      font-weight: 400;
    }
    h1 {
      margin: 0;
      font-family: "Source Han Serif CN", "Source Han Serif", serif;
      font-size: 156px;
      line-height: .98;
      letter-spacing: .02em;
      font-weight: 700;
    }
    .title-rule {
      width: 332px;
      height: 4px;
      margin-top: 42px;
      background: var(--ink);
    }
    .quote-block {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 286px;
      padding: 42px 48px 44px;
      color: var(--paper);
      background: var(--block);
    }
    .quote {
      margin: 0;
      font-family: "Source Han Serif CN", "Source Han Serif", serif;
      font-size: 40px;
      line-height: 1.35;
      letter-spacing: .02em;
      font-weight: 600;
      white-space: nowrap;
    }
    .meta {
      margin-top: 28px;
      font-size: 29px;
      line-height: 1;
      letter-spacing: .06em;
      color: rgba(243, 238, 228, .78);
    }
    .meta span + span::before {
      content: "·";
      margin: 0 20px;
      color: rgba(243, 238, 228, .5);
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="陈衔说中国美术史课程入口封面克制版">
    <div class="art" aria-hidden="true">
      <img src="../../assets/artworks/provided/元_倪瓒_容膝斋图_1.jpg" alt="">
    </div>
    <section class="title">
      <p class="eyebrow">说给所有人听的</p>
      <h1>中国美术史</h1>
      <div class="title-rule"></div>
    </section>
    <section class="quote-block">
      <p class="quote">“了解艺术史，就是了解人类意趣变化的历史。”</p>
      <div class="meta">
        <span>持续更新中</span><span>共3大系列24章节</span>
      </div>
    </section>
  </main>
</body>
</html>
